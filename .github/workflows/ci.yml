name: CI

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.5"
      - run: ruff check src tests examples benchmarks
      - run: ruff format --check src tests examples benchmarks

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    env:
      MPLBACKEND: Agg
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: pip install -e ".[pistonball,video,dev]"
      - name: Run tests
        run: pytest -q
      - name: Smoke-test examples
        run: |
          python examples/quickstart.py --steps 5
          python examples/simple_transformer_example.py --quick --no-plot
          python examples/workflow_demo.py --no-save
          python examples/power_grid_demo.py --episodes 2 --steps 50
          python examples/platoon_demo.py --episodes 2 --steps 100
          env-lib list
          env-lib evaluate Formation-v0 --episodes 8 --num-envs 8
          python benchmarks/benchmark_envs.py --steps 20 --render-steps 2
          python benchmarks/benchmark_vector.py --quick
